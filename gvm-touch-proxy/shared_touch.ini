#
# Board: adp_star_sda8255 (sa8255-ivi)
# Routes host touch input to the WFD_CLIENT_TYPE_LA_GVM (0x7815) guest VM
# ports defined in
# gen4-5/vendor/qcom/proprietary/owfds-ship/boards/adp_star_sda8255/config/qcdisplaycfg.xml.
#
# device_id/display_id below must match the eQDIDeviceID/eQDIDisplayID
# attributes of the corresponding <WFDPort>/<PortAttribs> block under the
# 0x7815 WFDClient in qcdisplaycfg.xml. The proxy matches shared ports to
# host ports by these two integers (see gtp_link_ports() in
# gvm-touch-proxy.c) -- there is no separate "output name" field in this
# board's XML schema, so device_id/display_id are the only join key.
#
# Current mapping (DSI0/DSI1/eDP1 on the 0x7815 client):
#   - DSI0: device_id=0, display_id=1
#   - DSI1: device_id=0, display_id=2
#   - eDP1: device_id=0, display_id=3
#
# The host client (0x78FF) exposes a matching WFDPort at device_id=0,
# display_id=3 (its existing eDP0 port, see qcdisplaycfg.xml), so eDP1
# links successfully via gtp_link_ports(). DSI0 (display_id=1) and DSI1
# (display_id=2) have no corresponding 0x78FF port yet -- those two
# remain unlinked until the host client is extended to cover them too.

[host_client]
id = 0x78FF

# Master switch for IVI window management.
# 1: enable IVI WM setup and related behavior
# 0: disable IVI WM setup
ivi_window_management = 1

# Auto maintain Z-order on host screen.
# Test only: real application scenarios should let the window manager
# manage shared layer ordering in a unified way.
# 1: reorder shared layers by zorder_base automatically
# 0: keep compositor/default order
ivi_zorder_auto = 1

# Parameter passed to ivi_input_set_input_acceptance().
# Usually 1 to accept input, 0 to reject input.
ivi_input_acceptance = 1

# Parameter passed to ivi_input_set_input_focus().
# Usually 1 to focus, 0 to clear focus.
ivi_input_focus = 1

# Enable touch event log.
# 1: print all received touch events with portname and uinput_fd
# 0: disable touch event log
touch_log_enabled = 1

# Log output control.
# 0: direct output only
# 1: output to /tmp/gvm-touch-proxy.log only
# 2: output to both direct output and file
log_control_mode = 2

# DSI0 -> LA_GVM (eQDIDeviceID=0, eQDIDisplayID=1)
[vm_client]
id = 0x7815
device_id = 0
display_id = 1
ivi_surface_id = 100
ivi_layer_id = 200

# DSI1 -> LA_GVM (eQDIDeviceID=0, eQDIDisplayID=2)
[vm_client]
id = 0x7815
device_id = 0
display_id = 2
ivi_surface_id = 101
ivi_layer_id = 201

# eDP1 -> LA_GVM (eQDIDeviceID=0, eQDIDisplayID=3)
[vm_client]
id = 0x7815
device_id = 0
display_id = 3
ivi_surface_id = 102
ivi_layer_id = 202
