[host_client]
id = 0x78FF

# Master switch for IVI window management.
# 1: enable IVI WM setup and related behavior
# 0: disable IVI WM setup
ivi_window_management = 1

# Auto maintain Z-order on host screen.
# Test only: real application scenarios should let the window manager
# manage shared layer ordering in a unified way.
# 1: reorder shared layers by zorder_base automatically
# 0: keep compositor/default order
ivi_zorder_auto = 1

# Parameter passed to ivi_input_set_input_acceptance().
# Usually 1 to accept input, 0 to reject input.
ivi_input_acceptance = 1

# Parameter passed to ivi_input_set_input_focus().
# Usually 1 to focus, 0 to clear focus.
ivi_input_focus = 1

# Enable touch event log.
# 1: print all received touch events with portname and uinput_fd
# 0: disable touch event log
touch_log_enabled = 1

# Log output control.
# 0: direct output only
# 1: output to /tmp/gvm-touch-proxy.log only
# 2: output to both direct output and file
log_control_mode = 2

[vm_client]
id = 0x7815
output = DP0S078151
ivi_surface_id = 100
ivi_layer_id = 200

[vm_client]
id = 0x7815
output = DP1S078152
ivi_surface_id = 101
ivi_layer_id = 201
